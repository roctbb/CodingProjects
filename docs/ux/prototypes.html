  function closeDialog(){const overlay=$('.cp-overlay');overlay.hidden=true;returnFocus?.focus();}
  function dialog(title,body){returnFocus=document.activeElement;$('#cp-dialog-title').textContent=title;$('[data-dialog-body]').innerHTML=body;$('.cp-overlay').hidden=false;if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16,'stroke-width':1.6}});$('[data-close-dialog]').focus();}
  const demoForm=(label,placeholder='')=>'<form class="cp-form" data-save-dialog><label class="cp-field">'+label+'<input placeholder="'+placeholder+'" required></label><div class="cp-form-footer"><button class="cp-button" type="button" data-close-dialog>Отмена</button><button class="cp-button cp-button-main" type="button" data-demo-submit>Сохранить</button></div></form>';
  function openDialog(name){
    if(name==='room')dialog('Настроить комнату','<form class="cp-form" data-save-dialog><label class="cp-field">Стол<select><option>Ноутбук</option><option>Пусто</option></select></label><label class="cp-field">Питомец<select><option>Пока без питомца</option><option>Кот</option></select></label><div class="cp-form-footer"><button class="cp-button" type="button" data-close-dialog>Отмена</button><button class="cp-button cp-button-main" type="button" data-demo-submit>Сохранить комнату</button></div></form><div class="cp-section"><h2>Свой персонаж</h2><p class="cp-small cp-muted" style="margin:8px 0 12px">Создать по вашей аватарке · 100 GC</p><button type="button" class="cp-button" data-generate>Создать персонажа</button></div>');
    else if(name==='wallet')dialog('История GC','<div class="cp-row"><span class="cp-grow">Баланс</span><strong>350 GC</strong></div><div class="cp-row"><div class="cp-grow"><strong>Учебный проект</strong><p class="cp-small cp-muted">10 ноября</p></div><span>+100 GC</span></div><div class="cp-row"><div class="cp-grow"><strong>Ноутбук для комнаты</strong><p class="cp-small cp-muted">9 ноября</p></div><span>−180 GC</span></div><button class="cp-button cp-button-quiet" type="button" data-go="market">В магазин →</button>');
    else if(name==='invite')dialog('Присоединиться к курсу',demoForm('Код приглашения','Например, PYTHON26'));
    else if(name==='chapters')dialog('Главы курса','<div class="cp-stack">'+['Первые программы','Условия и циклы','Эффективность алгоритмов','Рекурсия и проекты'].map(t=>'<button type="button" class="cp-button" data-close-dialog>'+t+'</button>').join('')+'</div>');
    else if(name==='people-filter')dialog('Участники','<div class="cp-stack">'+[['all','Все участники'],['student','Ученики'],['teacher','Преподаватели']].map(([v,t])=>'<button type="button" class="cp-button" data-people-filter="'+v+'">'+t+'</button>').join('')+'</div>');
    else if(name==='bid')dialog('Сделать ставку',demoForm('Ваша ставка, GC','От 180'));
    else if(name==='email')dialog('Изменить почту',demoForm('Новый адрес','alice@example.test'));
    else if(name==='sso')dialog('Личный кабинет Силаэдра','<p>Следующий шаг — вход в личный кабинет и подтверждение связи с аккаунтом.</p><div class="cp-actions" style="margin-top:20px"><button type="button" class="cp-button cp-button-main" data-close-dialog>Продолжить</button></div>');
    else if(name==='planner')dialog('План занятий','<p>Ближайшие занятия курса.</p><div class="cp-row"><span class="cp-date">12.11</span><div><strong>Знакомимся с рекурсией</strong><p class="cp-small cp-muted">2 ступени · 1 тест · 1 задача</p></div></div><div class="cp-row"><span class="cp-date">19.11</span><div><strong>Продолжение и практика</strong><p class="cp-small cp-muted">Стек вызовов · командная работа</p></div></div>');
    else if(name==='task-create')dialog('Добавить задачу',demoForm('Название задачи','Новая задача'));
    else if(name==='create-course')dialog('Создать курс',demoForm('Название курса','Python · 8 класс'));
    else dialog('Действия с курсом','<div class="cp-stack"><button class="cp-button" type="button" data-dialog="planner">План занятий</button><button class="cp-button" type="button" data-close-dialog>Редактировать программу</button><button class="cp-button" type="button" data-close-dialog>Статистика</button></div>');
  }
  root.addEventListener('click',e=>{
    const target=e.target.closest('button');if(!target)return;
    if(target.dataset.go){state.screen=target.dataset.go;if(state.screen==='account')state.accountTab=target.dataset.section||'account';if(state.screen==='profile'){state.profileName='Алиса Соколова';state.own=true;}closeDialog();render();save();}
    else if(target.hasAttribute('data-demo-submit'))submitDemo(target.closest('form'));
    else if(target.dataset.tab){state[target.dataset.tab]=target.dataset.value;render();save();}
    else if(target.dataset.task){state.task=target.dataset.task;render();save();}
    else if(target.hasAttribute('data-menu'))$('.cp-user-menu').hidden=!$('.cp-user-menu').hidden;
    else if(target.hasAttribute('data-mobile-menu'))$('.cp-product').classList.toggle('cp-menu-open');
    else if(target.hasAttribute('data-close-dialog'))closeDialog();
    else if(target.dataset.dialog)openDialog(target.dataset.dialog);
    else if(target.dataset.buy){state.pendingPurchase=target.dataset.buy;dialog('Купить «'+esc(target.dataset.buy)+'»?','<p>После покупки предмет появится в вашем списке покупок и будет доступен для настройки профиля.</p><div class="cp-actions" style="margin-top:20px"><button class="cp-button" type="button" data-close-dialog>Отмена</button><button class="cp-button cp-button-main" type="button" data-confirm-buy>Купить</button></div>');}
    else if(target.hasAttribute('data-confirm-buy')){closeDialog();state.lastPurchase=state.pendingPurchase;state.marketTab='purchases';render();save();toast('Пример: покупка появилась в личном списке.');}
    else if(target.hasAttribute('data-person')){state.screen='profile';state.profileName=target.dataset.person;state.own=target.dataset.person==='Алиса Соколова';render();save();}
    else if(target.dataset.peopleFilter){state.peopleFilter=target.dataset.peopleFilter;closeDialog();render();save();}
    else if(target.hasAttribute('data-telegram')){state.telegram=!state.telegram;render();save();toast(state.telegram?'Пример: аккаунт подключён.':'Пример: привязка отключена.');}
    else if(target.hasAttribute('data-generate')){target.textContent='Создаём персонажа…';target.disabled=true;setTimeout(()=>{target.textContent='Персонаж готов';if(target.isConnected){toast('Пример: новый персонаж появится в комнате.');}},1000);}
  });
  function submitDemo(form){if(!form?.reportValidity())return;if(form.hasAttribute('data-submit-solution')){state.submitted[state.task]=true;render();save();toast('Пример: решение отправлено на проверку.');}else if(form.hasAttribute('data-save-personal')){toast('Пример: изменения сохранены.');}else{closeDialog();toast('Пример: изменения сохранены.');}}
  root.addEventListener('submit',e=>{e.preventDefault();submitDemo(e.target);});
  root.addEventListener('input',e=>{if(e.target.hasAttribute('data-people-search')){state.query=e.target.value;$('[data-people-list]').innerHTML=peopleRows();save();}});
  $('[data-preview-screen]').addEventListener('change',e=>{state.screen=e.target.value;closeDialog();render();save();});
  $('[data-preview-role]').addEventListener('change',e=>{state.role=e.target.value;render();save();});
  root.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('form input')){e.preventDefault();submitDemo(e.target.closest('form'));}if(e.key==='Escape'){closeDialog();$('.cp-user-menu').hidden=true;$('.cp-product').classList.remove('cp-menu-open');}if(e.key==='Tab'&&!$('.cp-overlay').hidden){const els=[...$('.cp-dialog').querySelectorAll('button:not([disabled]),input,select,textarea')];const first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
  $('.cp-overlay').addEventListener('click',e=>{if(e.target===$('.cp-overlay'))closeDialog();});
  window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);render();}});
  render();
  if(globalThis.Tweak){const tweak=new Tweak({container:$('.cp-product'),onChange:()=>{root.style.setProperty('--p-radius',preferences.radius+'px');root.style.setProperty('--p-space',preferences.density==='Компактная'?'12px':'16px');render();save();}});tweak.addSlider(preferences,'radius',{label:'Скругление карточек',min:6,max:12,unit:'px'});tweak.addSelect(preferences,'density',{label:'Плотность',options:['Обычная','Компактная']});tweak.addToggle(state,'own',{label:'Свой профиль'});}
})();
</script>
